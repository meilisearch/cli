name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the OpenAPI documents the contract tests read
        run: pnpm openapi
        env:
          GITHUB_TOKEN: ${{ secrets.MEILI_BOT_GH_PAT }}
      - run: pnpm gen:management
      - name: The committed Management API client must match the document
        run: git diff --exit-code src/lib/clients/management/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm gen:manifest
      - name: The committed manifest must match the code
        run: git diff --exit-code oclif.manifest.json
      - run: pnpm exec vitest run --project unit --project contract

  integration-meilisearch:
    name: Integration tests against Meilisearch
    runs-on: ubuntu-latest
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.54.0
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: masterKey
          MEILI_NO_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # On main only, after the tests. See the Release section of CONTRIBUTING.md.
  release:
    name: Version Packages pull request, or publish on npm
    if: github.event_name == 'push'
    needs: [checks, integration-meilisearch]
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: npm 11, for trusted publishing; Node 22 comes with npm 10
        run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # A pull request opened with the workflow token runs no workflow, so CI would never test it.
          github-token: ${{ secrets.MEILI_BOT_GH_PAT }}
          # The manifest holds the version, and CI checks that it matches the code.
          version-script: pnpm changeset version && pnpm gen:manifest
          # npm authenticates with the OIDC token of the job: trusted publishing, set up on npmjs.com.
          publish-script: pnpm changeset publish
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

  binaries:
    name: Archives with Node inside, attached to the GitHub release
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm archives
      - name: Attach the archives
        working-directory: dist
        # Named without version, for the latest/download URL of scripts/install.sh.
        run: |
          for archive in meili-v*.tar.gz; do mv "$archive" "meili-${archive#meili-v*-*-}"; done
          sha256sum meili-*.tar.gz > SHA256SUMS
          gh release upload "v$VERSION" meili-*.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.MEILI_BOT_GH_PAT }}
          VERSION: ${{ needs.release.outputs.version }}

  homebrew:
    name: Formula pushed to meilisearch/homebrew-tap
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          url="https://registry.npmjs.org/@meilisearch/cli/-/cli-$VERSION.tgz"
          sha256=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors "$url" | sha256sum | cut -d ' ' -f 1)
          git clone "https://x-access-token:$GH_TOKEN@github.com/meilisearch/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/VERSION/$VERSION/" -e "s/SHA256/$sha256/" .github/homebrew/meili.rb > tap/Formula/meili.rb
          cd tap
          git add Formula/meili.rb
          git -c user.name=meili-bot -c user.email=robot@meilisearch.com commit -m "meili $VERSION"
          git push
        env:
          GH_TOKEN: ${{ secrets.MEILI_BOT_GH_PAT }}
          VERSION: ${{ needs.release.outputs.version }}
